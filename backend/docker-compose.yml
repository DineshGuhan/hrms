services:
  postgres:
    image: postgres:16
    container_name: hrms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrms_dev
    ports:
      - '5432:5432'
    volumes:
      - hrms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hrms_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hrms_pgdata:
